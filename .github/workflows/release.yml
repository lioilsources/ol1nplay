name: release

# Pushing a v* tag builds the Windows player (desktop UI + engine + FFmpeg
# DLLs in one zip) and the Android remote, and attaches both to the release.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows player
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: engine/go.mod
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # The LGPL build: the engine only links libavformat/libavcodec/libavutil
      # dynamically, so the player's own licence stays ours to choose.
      - name: FFmpeg SDK (LGPL, shared)
        run: |
          curl -fsSL -o ffmpeg.zip \
            https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-lgpl-shared.zip
          7z x -y ffmpeg.zip > /dev/null
          mv ffmpeg-master-latest-win64-lgpl-shared engine/ffmpeg-win
          ls engine/ffmpeg-win/bin

      - name: Engine
        working-directory: engine
        env:
          CGO_ENABLED: '1'
          CC: gcc
        run: |
          gcc --version | head -1
          go build -ldflags "-s -w -X github.com/ol1n/ol1nplay/engine/api.Version=${GITHUB_REF_NAME}" \
            -o bin/ol1nplay-engine.exe ./cmd/engine

      - name: Desktop UI
        working-directory: app_desktop
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          flutter build windows --release

      - name: Assemble
        run: |
          out="dist/Elfton Player"
          mkdir -p "$out/engine"
          cp -r app_desktop/build/windows/x64/runner/Release/. "$out/"
          mv "$out/ol1nplay_desktop.exe" "$out/Elfton Player.exe"
          cp engine/bin/ol1nplay-engine.exe "$out/engine/"
          cp engine/ffmpeg-win/bin/avformat-*.dll engine/ffmpeg-win/bin/avcodec-*.dll \
             engine/ffmpeg-win/bin/avutil-*.dll engine/ffmpeg-win/bin/swresample-*.dll "$out/engine/"
          # MinGW builds import the pthread runtime.
          cp "$(dirname "$(command -v gcc)")/libwinpthread-1.dll" "$out/engine/"
          cp engine/ffmpeg-win/LICENSE.txt "$out/engine/FFMPEG-LICENSE.txt"
          # The UI and its plugins import the Visual C++ runtime; shipping it
          # app-local means nobody has to install the redistributable.
          crt="$(find "/c/Program Files/Microsoft Visual Studio" -type d -path '*/Redist/MSVC/*/x64/Microsoft.VC*.CRT' 2>/dev/null | sort | tail -1)"
          [ -n "$crt" ] || crt=/c/Windows/System32
          echo "VC runtime from: $crt"
          cp "$crt/msvcp140.dll" "$crt/vcruntime140.dll" "$crt/vcruntime140_1.dll" "$out/"
          cp LICENSES.md README.md CHANGELOG.md tools/install.ps1 "$out/"

      # Runs the packaged engine with nothing but Windows on the PATH, so a
      # DLL missing from the zip fails here and not on somebody's machine.
      - name: Smoke test the packaged engine
        shell: pwsh
        run: |
          $env:PATH = "C:\Windows\System32;C:\Windows"
          & "dist\Elfton Player\engine\ol1nplay-engine.exe" version
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "dist\Elfton Player\engine\ol1nplay-engine.exe" devices
          exit 0

      - name: Zip
        shell: pwsh
        run: Compress-Archive -Path "dist\Elfton Player" -DestinationPath "ElftonPlayer-${{ github.ref_name }}-Windows.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: ElftonPlayer-*-Windows.zip

      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ElftonPlayer-*-Windows.zip
          name: Elfton Player ${{ github.ref_name }}
          prerelease: true

  android:
    name: Android remote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Build APK
        working-directory: app_remote
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk \
            "../ElftonRemote-${GITHUB_REF_NAME}-Android.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: ElftonRemote-*-Android.apk
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ElftonRemote-*-Android.apk
          name: Elfton Player ${{ github.ref_name }}
          prerelease: true
