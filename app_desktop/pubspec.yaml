name: ol1nplay_desktop
description: "Ol1nPlay desktop: the Flutter face of the bit-perfect ASIO engine (Windows first, macOS for development)."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  shared_preferences: ^2.5.6
  window_manager: ^0.5.2
  tray_manager: ^0.5.3
  desktop_drop: ^0.8.4
  file_selector: ^1.1.0
  qr_flutter: ^4.1.0
  url_launcher: ^6.3.3
  path: ^1.9.1
  ol1nplay_shared:
    path: ../shared

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/tray/
